versions:
  # Latest version
  - sha: 4a03471bf2b160b4aaf577e66ca730a838bfebe3
    changeNotes: >-
      Encodes each segment of the client id with encodeUriComponent when building
      the script URL, and rejects values outside the {company}/{banner} format.
      Declares the Be developer id to Google through gtagSet.;
  - sha: 2ea836aced40332b0910c7c8431ffd061e7f6e77
    changeNotes: >-
      Emits url_passthrough and ads_data_redaction as separate set commands,
      before the default — inside the consent object gtag discards them silently.
      Signals the banner that the default state has already been published, so it
      is no longer emitted twice. Regions with a trailing comma no longer produce
      an empty entry.;
  - sha: 5b30806fc435216a144ec80dc800712882a60c93
    changeNotes: Initial release;
